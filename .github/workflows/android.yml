
name: Build TradeLock APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TradeLock_Android/**'
      - 'TradeLock_Android_Source_FIXED.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -o TradeLock_Android_Source_FIXED.zip -d .
          test -f TradeLock_Android/settings.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd TradeLock_Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeLock-debug-APK
          path: TradeLock_Android/app/build/outputs/apk/debug/app-debug.apk
